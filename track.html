<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Shipment | SwiftLink Logistics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
color:#222;
}

header{
background:#0B1F3A;
padding:18px;
text-align:center;
color:white;
}

.container{
max-width:800px;
margin:50px auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,.1);
}

h1{
margin-bottom:15px;
}

input{
width:100%;
padding:15px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
margin:20px 0;
}

button{
width:100%;
padding:15px;
background:#1E88E5;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#1565C0;
}

.result{
margin-top:35px;
padding:25px;
background:#f8f9fb;
border-radius:10px;
display:none;
}

.status{
color:#1E88E5;
font-weight:bold;
font-size:20px;
margin-bottom:15px;
}

footer{
margin-top:60px;
background:#071321;
color:white;
text-align:center;
padding:25px;
}
</style>

</head>

<body>

<header>
<h2>SwiftLink Logistics</h2>
</header>

<div class="container">

<h1>Track Your Shipment</h1>

<p>Enter your SwiftLink shipment ID below.</p>

<input
id="tracking"
placeholder="Example: SL-250913-0001">

<button onclick="trackShipment()">
Track Shipment
</button>

<div class="result" id="result">

<div class="status" id="status"></div>

<p><strong>Shipment ID:</strong> <span id="id"></span></p>

<p><strong>Origin:</strong> Lagos, Nigeria</p>

<p><strong>Destination:</strong> New York, USA</p>

<p><strong>Estimated Delivery:</strong> 20 September 2026</p>

</div>

</div>

<footer>

<p>© 2026 SwiftLink Logistics</p>

</footer>

<script>

function trackShipment(){

let id=document.getElementById("tracking").value.trim();

if(id==="SL-250913-0001"){

document.getElementById("result").style.display="block";

document.getElementById("status").innerHTML="In Transit";

document.getElementById("id").innerHTML=id;

}else{

alert("Shipment not found.");

}

}

</script>

</body>
</html>
